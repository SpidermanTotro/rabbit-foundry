name: Rabbit Code tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: rabbit-code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11 regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,training]"
      - name: Test
        run: pytest -q

  lightweight-ui:
    name: No-Torch CLI/UI smoke test (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CLI without training dependencies
        run: python -m pip install -e .
      - name: Smoke test without Torch
        run: |
          python -c "import rabbit_foundry.helper_cli, rabbit_foundry.rabbit_code, rabbit_foundry.web_ui; import sys; assert 'torch' not in sys.modules"
          rabbit --help
          rabbit-code --help
          rabbit doctor --json
